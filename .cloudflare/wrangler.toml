name = "drinkspry-site"
main = "worker.js"
compatibility_date = "2025-09-15"
workers_dev = false
routes = [
  { pattern = "drinkspry.com", custom_domain = true },
  { pattern = "www.drinkspry.com", custom_domain = true },
]

[assets]
directory = "../"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "FORMS"
database_name = "spry-site-forms"
database_id = "3d29a031-977f-410f-abb1-6ca07387f836"

# Once an hour, retry sign-ups Loops has not taken yet. Cloudflare only accepts a schedule on an account that has a
# workers.dev subdomain; this one got its subdomain on 19 Nov 2026. The site itself is not served there (workers_dev = false).
[triggers]
crons = ["23 * * * *"]

# Sign-ups in one hour above this number are stored but held back from Loops. Raise it before a press day.
[vars]
SIGNUP_HOURLY_CAP = "60"

# Secret, added in the Cloudflare dashboard (Workers & Pages > drinkspry-site > Settings > Variables and Secrets,
# type Secret), never in this file, a chat or the repository:
#   LOOPS_API_KEY   (Loops > Settings > API, a key named spry-site-signup)
